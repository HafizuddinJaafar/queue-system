<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Queue Display</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      padding: 25px 40px;
      text-align: center;
      background: #1b1b1b;
      border-bottom: 2px solid #333;
    }

    .header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: bold;
    }

    .header p {
      margin: 8px 0 0;
      color: #aaa;
      font-size: 18px;
    }

    /* =========================
       DISPLAY
    ========================= */

    .display-container {
      flex: 1;
      width: 100%;
      display: grid;

      /* FORCE 2 COLUMNS */
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 30px;
      padding: 40px;

      align-items: center;
      justify-content: center;
    }

    /* =========================
       COUNTER CARD
    ========================= */

    .counter-card {
      width: 100%;
      min-height: 350px;

      background: #1d1d1d;
      border-radius: 20px;

      padding: 35px;

      text-align: center;

      border: 2px solid #333;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.3);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .counter-name {
      font-size: 32px;
      font-weight: bold;
      color: #aaa;
      margin-bottom: 15px;
    }

    .queue-number {
      font-size: 110px;
      font-weight: bold;
      line-height: 1;

      margin: 20px 0;

      white-space: nowrap;
    }

    .service-name {
      font-size: 24px;
      color: #bbb;

      margin-bottom: 15px;

      min-height: 30px;
    }

    .status {
      font-size: 20px;
      color: #777;
    }

    .empty {
      font-size: 50px;
      color: #555;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      width: 100%;

      padding: 15px;

      text-align: center;

      background: #1b1b1b;

      color: #666;

      font-size: 14px;
    }

    /* =========================
       TABLET / SMALL SCREEN
    ========================= */

    @media (max-width: 900px) {

      .header {
        padding: 20px;
      }

      .header h1 {
        font-size: 32px;
      }

      .header p {
        font-size: 16px;
      }

      .display-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
        padding: 15px;
      }

      .counter-card {
        min-height: 280px;
        padding: 20px;
      }

      .counter-name {
        font-size: 24px;
      }

      .queue-number {
        font-size: 75px;
      }

      .service-name {
        font-size: 18px;
      }

      .status {
        font-size: 16px;
      }
    }

    /* =========================
       PHONE
    ========================= */

    @media (max-width: 600px) {

      .display-container {
        grid-template-columns: 1fr;
      }

      .counter-card {
        min-height: 250px;
      }

      .queue-number {
        font-size: 80px;
      }
    }

    /* =========================
       TV / ANDROID BOX LANDSCAPE
    ========================= */

    @media (min-width: 1000px) {

      .header {
        padding: 30px 40px;
      }

      .header h1 {
        font-size: 48px;
      }

      .header p {
        font-size: 20px;
      }

      .display-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 40px;
        padding: 40px;
      }

      .counter-card {
        min-height: 400px;
      }

      .counter-name {
        font-size: 36px;
      }

      .queue-number {
        font-size: 130px;
      }

      .service-name {
        font-size: 26px;
      }

      .status {
        font-size: 22px;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <div class="header">

    <h1>QUEUE SYSTEM</h1>

    <p>
      Sila tunggu giliran anda
    </p>

  </div>


  <!-- =========================
       COUNTER DISPLAY
  ========================= -->

  <div
    class="display-container"
    id="displayContainer"
  >

    <div class="empty">
      Loading...
    </div>

  </div>


  <!-- =========================
       FOOTER
  ========================= -->

  <div class="footer">

    Please wait for your number to be called

  </div>


  <script>

    // ==================================================
    // SUPABASE CONFIG
    // ==================================================

    const SUPABASE_URL =
      "https://evgctimzyxvpmbisguqe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-NNxefUNkEcxMRQZM9Ggug_ncGpz4d9";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==================================================
    // LOAD DISPLAY
    // ==================================================

    async function loadDisplay() {

      const container =
        document.getElementById(
          "displayContainer"
        );


      try {

        // ----------------------------------------------
        // GET ACTIVE COUNTERS
        // ----------------------------------------------

        const {
          data: counters,
          error: counterError
        } =
          await supabaseClient
            .from("counters")
            .select("*")
            .eq("is_active", true)
            .order("id");


        if (counterError) {

          throw counterError;

        }


        // ----------------------------------------------
        // GET SERVING TICKETS
        // ----------------------------------------------

        const {
          data: tickets,
          error: ticketError
        } =
          await supabaseClient
            .from("queue_tickets")
            .select(`
              id,
              display_number,
              status,
              counter_id,
              service_id,
              services (
                name
              )
            `)
            .eq("status", "serving")
            .order("id", {
              ascending: false
            });


        if (ticketError) {

          throw ticketError;

        }


        // ----------------------------------------------
        // CLEAR DISPLAY
        // ----------------------------------------------

        container.innerHTML = "";


        // ----------------------------------------------
        // NO COUNTERS
        // ----------------------------------------------

        if (
          !counters ||
          counters.length === 0
        ) {

          container.innerHTML = `
            <div class="empty">
              No counters available
            </div>
          `;

          return;

        }


        // ----------------------------------------------
        // CREATE COUNTER CARDS
        // ----------------------------------------------

        counters.forEach(counter => {

          const ticket =
            tickets?.find(
              t =>
                t.counter_id === counter.id
            );


          const card =
            document.createElement("div");


          card.className =
            "counter-card";


          // --------------------------------------------
          // CUSTOMER BEING SERVED
          // --------------------------------------------

          if (ticket) {

            const serviceName =
              ticket.services?.name || "";


            card.innerHTML = `

              <div class="counter-name">

                ${escapeHtml(
                  counter.name
                )}

              </div>


              <div class="queue-number">

                ${escapeHtml(
                  ticket.display_number
                )}

              </div>


              <div class="service-name">

                ${escapeHtml(
                  serviceName
                )}

              </div>


              <div class="status">

                Sila ke kaunter

              </div>

            `;

          }


          // --------------------------------------------
          // NO CUSTOMER
          // --------------------------------------------

          else {

            card.innerHTML = `

              <div class="counter-name">

                ${escapeHtml(
                  counter.name
                )}

              </div>


              <div class="queue-number empty">

                ---

              </div>


              <div class="service-name">

                Tiada pelanggan

              </div>


              <div class="status">

                Sila tunggu

              </div>

            `;

          }


          container.appendChild(card);

        });


      }

      catch (error) {

        console.error(
          "Display error:",
          error
        );


        container.innerHTML = `

          <div class="empty">

            Unable to load queue

          </div>

        `;

      }

    }


    // ==================================================
    // ESCAPE HTML
    // ==================================================

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==================================================
    // SUPABASE REALTIME
    // ==================================================

    supabaseClient

      .channel("queue-display")

      .on(

        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "queue_tickets"
        },

        payload => {

          console.log(
            "Queue updated:",
            payload
          );


          loadDisplay();

        }

      )

      .subscribe();


    // ==================================================
    // INITIAL LOAD
    // ==================================================

    loadDisplay();


    // ==================================================
    // BACKUP AUTO REFRESH
    // ==================================================

    // Android Box browser kadang-kadang
    // tak maintain Supabase realtime.
    //
    // Jadi kita refresh data setiap 3 saat.

    setInterval(
      loadDisplay,
      3000
    );


  </script>

</body>
</html>
