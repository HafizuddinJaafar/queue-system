<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Queue System</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 30px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .service-button {
      width: 100%;
      padding: 18px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: white;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }

    .service-button:hover {
      border-color: #111;
      transform: translateY(-1px);
    }

    .service-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .service-name {
      display: block;
      font-weight: bold;
    }

    .service-prefix {
      display: block;
      margin-top: 4px;
      color: #777;
      font-size: 13px;
    }

    .queue-result {
      display: none;
    }

    .queue-label {
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .queue-number {
      text-align: center;
      font-size: 64px;
      font-weight: bold;
      margin: 10px 0 25px;
    }

    .info-box {
      background: #f7f7f7;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .info-label {
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 25px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      background: #eef7ee;
      color: #267326;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .status.called {
      background: #fff4d6;
      color: #8a5a00;
    }

    .status.completed {
      background: #e8f1ff;
      color: #245a9c;
    }

    .status.skipped,
    .status.cancelled {
      background: #ffe5e5;
      color: #a00000;
    }

    .back-button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: #eee;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 14px;
    }

    .refresh-info {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Queue System</h1>
      <p>Sila pilih perkhidmatan</p>
    </div>

    <!-- SERVICE CARD -->
    <div class="card" id="serviceCard">

      <h2>Pilih Perkhidmatan</h2>

      <div id="services">
        <div class="loading">
          Memuatkan perkhidmatan...
        </div>
      </div>

      <div id="errorMessage"></div>

    </div>


    <!-- QUEUE RESULT -->
    <div class="card queue-result" id="queueResult">

      <div class="queue-label">
        Nombor giliran anda
      </div>

      <div class="queue-number" id="queueNumber">
        A001
      </div>


      <div class="status" id="queueStatus">
        Menunggu giliran
      </div>


      <!-- CURRENT NUMBER -->
      <div class="info-box">

        <div class="info-label">
          Nombor sedang dipanggil
        </div>

        <div class="info-value" id="currentNumber">
          -
        </div>

      </div>


      <!-- PEOPLE AHEAD -->
      <div class="info-box">

        <div class="info-label">
          Orang di hadapan anda
        </div>

        <div class="info-value" id="peopleAhead">
          -
        </div>

      </div>


      <div class="refresh-info">
        Status akan dikemaskini secara automatik
      </div>


      <button
        class="back-button"
        onclick="location.reload()"
      >
        Ambil Nombor Lain
      </button>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://evgctimzyxvpmbisguqe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-NNxefUNkEcxMRQZM9Ggug_ncGpz4d9";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let myTicket = null;


    // ==========================================
    // LOAD SERVICES
    // ==========================================

    async function loadServices() {

      const servicesContainer =
        document.getElementById("services");


      const {
        data,
        error
      } = await supabaseClient
        .from("services")
        .select("*")
        .eq("is_active", true)
        .order("id");


      if (error) {

        console.error(error);

        servicesContainer.innerHTML = `
          <div class="error">
            Gagal memuatkan perkhidmatan.
          </div>
        `;

        return;
      }


      servicesContainer.innerHTML = "";


      data.forEach(service => {

        const button =
          document.createElement("button");


        button.className =
          "service-button";


        button.innerHTML = `
          <span class="service-name">
            ${service.name}
          </span>

          <span class="service-prefix">
            Prefix nombor: ${service.prefix}
          </span>
        `;


        button.onclick = function() {

          takeQueueNumber(service);

        };


        servicesContainer.appendChild(button);

      });

    }


    // ==========================================
    // TAKE QUEUE NUMBER
    // ==========================================

    async function takeQueueNumber(service) {

      const buttons =
        document.querySelectorAll(
          ".service-button"
        );


      buttons.forEach(button => {

        button.disabled = true;

      });


      try {

        const today =
          new Date()
            .toISOString()
            .split("T")[0];


        const {
          data: existing,
          error: fetchError
        } = await supabaseClient
          .from("queue_tickets")
          .select("queue_number")
          .eq("service_id", service.id)
          .gte(
            "created_at",
            `${today}T00:00:00`
          )
          .order(
            "queue_number",
            {
              ascending: false
            }
          )
          .limit(1);


        if (fetchError) {

          throw fetchError;

        }


        let nextNumber = 1;


        if (
          existing &&
          existing.length > 0
        ) {

          nextNumber =
            existing[0].queue_number + 1;

        }


        const displayNumber =
          service.prefix +
          String(nextNumber)
            .padStart(3, "0");


        const {
          data: insertedTicket,
          error: insertError
        } = await supabaseClient
          .from("queue_tickets")
          .insert({

            service_id:
              service.id,

            queue_number:
              nextNumber,

            display_number:
              displayNumber,

            status:
              "waiting"

          })
          .select()
          .single();


        if (insertError) {

          throw insertError;

        }


        // Simpan ticket semasa
        myTicket = insertedTicket;


        // Tukar paparan
        document.getElementById(
          "serviceCard"
        ).style.display = "none";


        document.getElementById(
          "queueResult"
        ).style.display = "block";


        document.getElementById(
          "queueNumber"
        ).textContent =
          displayNumber;


        // Load status
        await updateQueueStatus();


        // Aktifkan realtime
        subscribeToQueue();


      } catch (error) {

        console.error(error);


        document.getElementById(
          "errorMessage"
        ).innerHTML = `
          <div class="error">
            Gagal mengambil nombor.
            <br>
            Sila cuba lagi.
          </div>
        `;


        buttons.forEach(button => {

          button.disabled = false;

        });

      }

    }


    // ==========================================
    // UPDATE QUEUE STATUS
    // ==========================================

    async function updateQueueStatus() {

      if (!myTicket) {
        return;
      }


      // Ambil ticket sendiri
      const {
        data: myData,
        error: myError
      } = await supabaseClient
        .from("queue_tickets")
        .select("*")
        .eq("id", myTicket.id)
        .single();


      if (myError) {

        console.error(myError);

        return;

      }


      myTicket = myData;


      // ------------------------------------------
      // Cari nombor yang sedang serving
      // ------------------------------------------

      const {
        data: servingTickets,
        error: servingError
      } = await supabaseClient
        .from("queue_tickets")
        .select("queue_number, display_number")
        .eq(
          "service_id",
          myTicket.service_id
        )
        .eq(
          "status",
          "serving"
        )
        .order(
          "queue_number",
          {
            ascending: true
          }
        )
        .limit(1);


      if (servingError) {

        console.error(servingError);

        return;

      }


      let currentNumber = "-";


      if (
        servingTickets &&
        servingTickets.length > 0
      ) {

        currentNumber =
          servingTickets[0].display_number;

      }


      document.getElementById(
        "currentNumber"
      ).textContent =
        currentNumber;


      // ------------------------------------------
      // Kira orang di hadapan
      // ------------------------------------------

      let peopleAhead = 0;


      if (myTicket.status === "waiting") {

        const {
          count,
          error: countError
        } = await supabaseClient
          .from("queue_tickets")
          .select(
            "*",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "service_id",
            myTicket.service_id
          )
          .eq(
            "status",
            "waiting"
          )
          .lt(
            "queue_number",
            myTicket.queue_number
          );


        if (countError) {

          console.error(countError);

        } else {

          peopleAhead = count || 0;

        }

      }


      document.getElementById(
        "peopleAhead"
      ).textContent =
        peopleAhead;


      // ------------------------------------------
      // Status text
      // ------------------------------------------

      const statusElement =
        document.getElementById(
          "queueStatus"
        );


      statusElement.className =
        "status";


      if (myTicket.status === "waiting") {

        statusElement.textContent =
          "Menunggu giliran";

      }


      else if (
        myTicket.status === "serving"
      ) {

        statusElement.className =
          "status called";

        statusElement.textContent =
          "🔔 Giliran anda sedang dipanggil!";

      }


      else if (
        myTicket.status === "completed"
      ) {

        statusElement.className =
          "status completed";

        statusElement.textContent =
          "Selesai";

      }


      else if (
        myTicket.status === "skipped"
      ) {

        statusElement.className =
          "status skipped";

        statusElement.textContent =
          "Nombor anda telah dilepaskan";

      }


      else if (
        myTicket.status === "cancelled"
      ) {

        statusElement.className =
          "status cancelled";

        statusElement.textContent =
          "Nombor anda telah dibatalkan";

      }

    }


    // ==========================================
    // REALTIME
    // ==========================================

    function subscribeToQueue() {

      supabaseClient
        .channel(
          "queue-live-" +
          myTicket.id
        )
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "queue_tickets"
          },
          function(payload) {

            console.log(
              "Queue berubah:",
              payload
            );


            updateQueueStatus();

          }
        )
        .subscribe();

    }


    // ==========================================
    // START
    // ==========================================

    loadServices();

  </script>

</body>
</html>
